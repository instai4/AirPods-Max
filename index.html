<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AirPods Max</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div id="splash-screen">
        <div class="splash-bg"></div>
        <svg viewBox="0 0 512 512">
            <path
                d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z" />
        </svg>
    </div>

    <body>

        <section class="slider-main">
            <div class="container">
                <div class="logo">
                    <a href="#"><img src="./Images/logo.svg" alt="logo"></a>
                </div>
                <div class="slider-content-wrap">
                    <div class="slider-content">
                        <h2 id="product-title" class="heading-style-2">Apple AirPods Max Wireless Over-Ear Headphones.
                        </h2>
                        <p id="product-desc">Active Noise Cancelling, Transparency Mode, Spatial Audio, Digital Crown
                            for Volume Control. Bluetooth Headphones for iPhone</p>
                        <h3 id="product-price" class="heading-style-2">$699.99</h3>
                        <div class="social-icons">
                            <a href="https://github.com/instai4" target="_blank"><img src="./Images/github.svg"
                                    alt="github"></a>
                            <a href="https://www.linkedin.com/in/anurag-singh-43230a380/" target="_blank"><img
                                    src="./Images/linkedin.svg" alt="linkedin"></a>
                            <a href="https://instai4.github.io/PORT-FOLIO/" target="_blank"><img
                                    src="./Images/portfolio.svg" alt="portfolio"></a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="slider-images">
                <img class="slider-image" src="./Images/green.png" alt="headphone image">
                <img class="slider-image" src="./Images/blue.png" alt="headphone image">
                <img class="slider-image" src="./Images/red.png" alt="headphone image">
                <img class="slider-image" src="./Images/white.png" alt="headphone image">
                <img class="slider-image" src="./Images/black.png" alt="headphone image">
            </div>

            <div id="backgrounds">
                <div class="background"
                    style="background: radial-gradient(50% 50% at 50% 50%, #C7F6D0 0%, #7CB686 92.19%);"></div>
                <div class="background"
                    style="background: radial-gradient(50% 50% at 50% 50%, #D1E4F6 0%, #5F9CCF 100%);"></div>
                <div class="background"
                    style="background: radial-gradient(50% 50% at 50% 50%, #FFB7B2 0%, #ED746E 100%);"></div>
                <div class="background"
                    style="background: radial-gradient(50% 50% at 50% 50%, #D7D7D7 0%, #979797 100%);"></div>
                <div class="background"
                    style="background: radial-gradient(50% 50% at 50% 50%, #6B6B6B 0%, #292929 100%);"></div>
            </div>
        </section>

    </body>

    <script src="./script.js"></script>

</body>

</html>
